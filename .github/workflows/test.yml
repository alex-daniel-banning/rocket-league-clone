name: Tests

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            libglfw3-dev \
            libgl1-mesa-dev \
            libassimp-dev \
            libgtest-dev
      
      - name: Configure
        run: cmake -B build
      
      - name: Build
        run: cmake --build build
      
      - name: Run tests
        run: ./build/tests
