name: clang-tidy
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang-tidy \
            cmake \
            jq \
            libglfw3-dev \
            libgl1-mesa-dev \
            libassimp-dev \
            libgtest-dev
      
      - name: Generate compile commands
        run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -B build
      
      - name: Run clang-tidy
        run: |
          jq -r '.[].file' build/compile_commands.json | \
            grep -E '\.(cpp|hpp)$' | \
            xargs clang-tidy -p build --warnings-as-errors='*'
